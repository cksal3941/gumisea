<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gumi Sea</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="logo">Gumi Sea</a>
      <nav class="main-nav">
        <a href="#">SHOP</a>
        <a href="#">OUR STORY</a>
        <a href="#">JOURNAL</a>
        <a href="#">CONTACT</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <!-- Layer 2: Product name texts -->
    <span class="product-name product-sey">SEY</span>
    <span class="product-name product-goldie">GOLDIE POP</span>
    <span class="product-name product-tangy">TANGY BLUE</span>

    <!-- Layer 3: Character images -->
    <img src="images/hero-sey-octopus.png" alt="SEY" class="hero-char char-octopus">
    <img src="images/hero-goldie-pop.png" alt="Goldie Pop" class="hero-char char-goldie">
    <img src="images/hero-tangy-blue.png" alt="Tangy Blue" class="hero-char char-tangy">
  </section>

  <script src="script.js"></script>
</body>
</html>
